<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Flutter automatically replaces this value during the web build.
    Firebase Hosting root deployment ke liye ye bilkul theek hai.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">

  <!-- Website Information -->
  <meta
    name="description"
    content="IELTS AI Master Admin Panel for managing users, IELTS tests, results, analytics, and application content."
  >

  <meta
    name="keywords"
    content="IELTS AI Master, IELTS Admin, Admin Dashboard, IELTS Management"
  >

  <meta name="author" content="IELTS AI Master">

  <!-- Mobile and Responsive Settings -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#08111F">

  <!-- Progressive Web App Settings -->
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Apple/iOS Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="IELTS AI Master Admin"
  >

  <link
    rel="apple-touch-icon"
    sizes="192x192"
    href="icons/Icon-192.png"
  >

  <!-- Browser Favicon -->
  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="favicon.png"
  >

  <!-- Page Title -->
  <title>IELTS AI Master Admin</title>

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <!-- Flutter Web Application -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
